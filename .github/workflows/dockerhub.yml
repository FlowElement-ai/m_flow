# M-Flow — Docker Hub: multi-arch publish for m_flow/m_flow.
# -----------------------------------------------------------------------------
# Tagging via docker/metadata-action; layer cache on registry. This file’s
# structure (concurrency key order, job id) is M-Flow-specific housekeeping.
# -----------------------------------------------------------------------------
name: publish | Docker Hub Image

concurrency:
  cancel-in-progress: true
  group: mflow-hub-main-${{ github.ref }}

on:
  release:
    types: [published]

permissions: { contents: read, packages: write }

env:
  IMAGE_REPO: m_flow/m_flow

jobs:
  mflow_registry_multiarch_push:
    name: Publish multi-arch Docker image to Docker Hub
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      # ── Checkout ──────────────────────────────────────────
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # ── Buildx ───────────────────────────────────────────
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      # ── Registry authentication ──────────────────────────
      - name: Open Docker Hub session
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── Derive OCI tags and labels ───────────────────────
      - name: Resolve OCI tag / label set
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6.0.0
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Build + Push ─────────────────────────────────────
      - name: docker buildx push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE_REPO }}:buildcache,mode=max

      # ── Summary ──────────────────────────────────────────
      - name: Record image digest in GitHub Step Summary
        run: |
          {
            echo "## Docker Publish Results"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Image | \`${{ env.IMAGE_REPO }}\` |"
            echo "| Digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| Platforms | linux/amd64, linux/arm64 |"
          } >> "$GITHUB_STEP_SUMMARY"
